<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="monoLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcf8f6"/>
      <stop offset="50%" stop-color="#f5efe9"/>
      <stop offset="100%" stop-color="#eae0d6"/>
    </linearGradient>
    <linearGradient id="monoLightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d151c"/>
      <stop offset="100%" stop-color="#1a060b"/>
    </linearGradient>
    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1a060b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- App Icon Background Frame -->
  <rect width="512" height="512" rx="112" fill="url(#monoLightBg)" stroke="#e4d9ce" stroke-width="4"/>
  
  <!-- Monofolio Geometric Monogram -->
  <g filter="url(#lightShadow)" fill="url(#monoLightFacet)">
    <!-- Primary Angled Prismatic Diamond -->
    <polygon points="270,140 322,214 268,296 216,372 164,296" />
    
    <!-- Secondary Downward Triangle Inset -->
    <polygon points="268,296 372,296 320,372" />
  </g>
</svg>
